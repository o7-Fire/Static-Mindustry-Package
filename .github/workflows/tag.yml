name: CI

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Get latest Mindustry tag
        run: |
          tag=$(git ls-remote --tags --refs --sort="version:refname" https://github.com/Anuken/Mindustry.git | awk -F/ 'END{print$NF}')
          echo "RELEASE_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
      - run: chrome --version
      
      - name: Download
        env:
          PYTHONUNBUFFERED: "1"
        run: python crawl.py "$RELEASE_VERSION" headless

      - name: Create release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          body: ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false

      - name: Upload artifacts
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./downloads/*
          tag: refs/tags/${{ env.RELEASE_VERSION }}
          file_glob: true
          overwrite: true
